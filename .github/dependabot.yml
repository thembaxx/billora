version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

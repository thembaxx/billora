    <script>
      try {
        const s = JSON.parse(localStorage.getItem('billora-settings') || '{}');
        const dark =
          s.theme === 'dark' ||
          ((!s.theme || s.theme === 'system') &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (dark)
          document.addEventListener(
            'DOMContentLoaded',
            () =>
              document
                .querySelector('link[rel=manifest]')
                ?.setAttribute('href', '/manifest-dark.webmanifest'),
            { once: true },
          );
        document.querySelector('meta[name="theme-color"]').content = dark ? '#17181c' : '#f5f5f8';
      } catch {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #f5f5f8;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #17181c;
      }
      .boot {
        height: 100dvh;
        display: grid;
        place-items: center;
        color: #ef542f;
        font: 500 30px system-ui;
      }
      .boot span {
